server:
  port: ${SERVER_PORT:8084}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%-5level]) [%yellow(%X{traceId})] [%thread] %cyan([%logger{50}]) - %msg%n"
  level:
    root: INFO

spring:
  application:
    name: HealthAgent
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:healthagent}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # GLM-4.7-Flash 配置 - 使用智谱AI官方SDK (zai-sdk)
  output:
    ansi:
      enabled: always  # 强制开启 ANSI 彩色输出
# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.healthagent.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  info:
    title: HealthAgent API
    description: 智能健康助手
    version: 1.0.0

# HealthAgent 配置
healthagent:
  auth:
    # 本地开发未配置 JWT_SECRET 时会自动生成临时强密钥；生产环境请务必显式配置
    jwt-secret: ${JWT_SECRET:}
    access-token-expiration-minutes: 120
    refresh-token-expiration-hours: 168
    # 认证拦截器开关，设为 false 可跳过鉴权（仅调试使用）
    interceptor-enabled: ${AUTH_INTERCEPTOR_ENABLED:false}
  # 默认管理员账户（生产环境必须修改或禁用）
  # 通过环境变量 APP_AUTH_DEFAULT_USERNAME 和 APP_AUTH_DEFAULT_PASSWORD 配置
  # 留空则禁用默认账户，必须通过注册功能创建账户
  default-username: ${APP_AUTH_DEFAULT_USERNAME:admin}
  default-password: ${APP_AUTH_DEFAULT_PASSWORD:admin123}
  skills:
    path: skills
  # GLM-4.7-Flash 模型配置
  chat:
    model: GLM-5.1
#    glm-4.6v 高速, glm-4.7-flash 免费, GLM-4.5-Air 额度,GLM-4.7-FlashX
  glm:
    api-key: ${GLM_API_KEY:}
